<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B10">
<meta name="robots" content="noindex,follow">
<title>MAYO 214 — Mañana abrimos</title>
<meta name="description" content="Mañana abriremos la página oficial de Mayo 214. Estate atento: viene con sorpresa.">
<meta property="og:type" content="website">
<meta property="og:title" content="MAYO 214 — Mañana abrimos">
<meta property="og:description" content="Estate atento. Viene con sorpresa.">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070B10; --cream:#F1F3F4; --cyan:#34D3DC; --cyan2:#7FE9F0; --red:#E23A5A;
    --muted:rgba(241,243,244,.62); --line:rgba(241,243,244,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--cream);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:grid; place-items:center;
    min-height:100vh; min-height:100dvh;
    padding:clamp(20px,5vw,48px);
    position:relative;
  }
  body::before{
    content:""; position:fixed; inset:-10%;
    background:
      radial-gradient(58% 42% at 50% -6%, rgba(52,211,220,.16), transparent 62%),
      radial-gradient(46% 40% at 88% 108%, rgba(226,58,90,.11), transparent 64%),
      radial-gradient(40% 34% at 6% 96%, rgba(52,211,220,.07), transparent 66%);
    pointer-events:none;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
  }
  .vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 22vmin 6vmin rgba(0,0,0,.55)}

  main{
    position:relative; z-index:2; width:100%; max-width:760px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }

  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:clamp(10px,2.6vw,12px); letter-spacing:.34em; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin-bottom:clamp(22px,4.4vh,40px);
  }
  .punto{
    width:7px; height:7px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 0 0 rgba(52,211,220,.55);
    animation:latido 2.6s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes latido{
    0%{box-shadow:0 0 0 0 rgba(52,211,220,.5)}
    60%{box-shadow:0 0 0 11px rgba(52,211,220,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,220,0)}
  }

  h1{
    font-family:Anton,Impact,"Arial Narrow",sans-serif;
    font-weight:400; text-transform:uppercase;
    font-size:clamp(36px,11.6vw,84px); line-height:.94; letter-spacing:-.015em;
  }
  h1 .fina{
    display:block; font-size:.46em; letter-spacing:.02em; line-height:1.1;
    color:var(--muted); margin-top:.42em;
  }
  h1 .marca{
    display:block; margin-top:.34em;
    background:linear-gradient(92deg,var(--cream) 4%,var(--cyan2) 34%,var(--cyan) 72%,var(--amber3,#1B9AA6) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .filete{
    width:72px; height:1px; margin:clamp(24px,4.6vh,40px) auto;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.9;
  }

  .gancho{
    font-family:Anton,Impact,sans-serif; text-transform:uppercase;
    font-size:clamp(26px,7.2vw,46px); line-height:1; letter-spacing:.02em;
    color:var(--cyan); text-shadow:0 0 26px rgba(52,211,220,.28);
  }
  .sorpresa{
    margin-top:clamp(12px,2.2vh,18px);
    font-size:clamp(14px,3.6vw,17px); color:var(--muted); font-weight:300;
    letter-spacing:.01em;
  }
  .sorpresa b{color:var(--cream); font-weight:600}

  footer{
    position:fixed; left:0; right:0; bottom:max(18px,env(safe-area-inset-bottom));
    z-index:2; text-align:center;
    font-size:clamp(9px,2.4vw,10.5px); letter-spacing:.3em; text-transform:uppercase;
    color:rgba(241,243,244,.34);
  }

  @media (prefers-reduced-motion:reduce){
    .punto{animation:none}
  }
  @media (max-height:560px){
    .filete{margin:18px auto}
  }
</style>
</head>
<body>
<div class="vignette" aria-hidden="true"></div>

<main>
  <div class="eyebrow"><span class="punto" aria-hidden="true"></span>Mayo 214 · Sierra Oeste</div>

  <h1>
    Mañana abrimos
    <span class="fina">la página oficial de</span>
    <span class="marca">Mayo 214</span>
  </h1>

  <div class="filete" aria-hidden="true"></div>

  <p class="gancho">Estate atento</p>
  <p class="sorpresa">Viene con <b>sorpresa</b>.</p>
</main>

<footer>mayo214.es</footer>

<script src="https://neo-metrics.dortizs76.workers.dev/beacon.js" data-site="mayo214" defer></script>
</body>
</html>
